{% extends 'base.html' %}{% block title %}Staff login — BlueWatch{% endblock %}{% block content %}<div class="container py-5"><div class="auth-card mx-auto"><div class="text-center"><span class="logo-mark"><i class="bi bi-water"></i></span><h1 class="h3 mt-3">Government and team login</h1><p>Public reports do not require an account.</p></div><form method="post">{% csrf_token %}{% if form.non_field_errors %}<div class="alert alert-danger">Your username or password was not recognised.</div>{% endif %}<div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" type="text" name="username" autocomplete="username" autofocus required id="id_username"></div><div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control" type="password" name="password" autocomplete="current-password" required id="id_password"></div><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-ocean w-100">Log in securely</button></form></div></div>{% endblock %}
